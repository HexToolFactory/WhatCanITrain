# Builds the addon zip and uploads it to CurseForge + GitHub Releases
# whenever a "v*" tag is pushed (e.g. v1.0.0).
# Requires the repo secret CF_API_KEY (CurseForge API token).
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A token pasted with a trailing newline breaks the CurseForge upload
      # ("Missing field `metadata`"), so strip whitespace first.
      - name: Clean CurseForge token
        env:
          RAW_CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          key=$(printf '%s' "$RAW_CF_API_KEY" | tr -d '[:space:]')
          echo "::add-mask::$key"
          echo "CF_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
